name: AutoWiring v0.3.18 incremental regression
on:
  push:
    branches: [feature/v0.3.18]
  pull_request:
    branches: [feature/v0.3.17]
  workflow_dispatch:

jobs:
  verify-incremental-tracing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight crop test dependency only
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile all Python sources
        run: python -m compileall -q autowiring viewer.py tests
      - name: Check app JavaScript syntax
        run: node --check web/app.js
      - name: Verify incremental caching, OCR crops, endpoint joins and terminal conflicts
        run: python -m unittest discover -s tests -p "test_trace_*.py" -v
