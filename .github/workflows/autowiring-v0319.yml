name: AutoWiring v0.3.19 source-evidence regression
on:
  push:
    branches: [feature/v0.3.19]
  pull_request:
    branches: [feature/v0.3.18]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated imaging dependency for synthetic crops
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile Python files
        run: python -m compileall -q autowiring viewer.py tests
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Verify prior schema can be upgraded in place
        run: |
          python - <<'PY'
          import sqlite3
          from viewer import setup
          with sqlite3.connect(':memory:') as con:
              setup(con)
              names={x[0] for x in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'corrected_runs_v0319','corrected_items_v0319','enhanced_runs_v0318','trace_runs_v0317'} <= names
              print('PASS: v0.3.19 tables coexist with all previous stage tables')
          PY
      - name: Run all cached OCR, circle, geometry, and review regressions
        run: python -m unittest discover -s tests -p "test_trace_*.py" -v
      - name: Check one-click UI wiring (never invokes old builders)
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('web/index.html').read_text()
          js=Path('web/app.js').read_text()
          backend=Path('viewer.py').read_text()
          for node in ('buildCorrected','layerCorrected','correctedInfo','correctedList','exportCorrected'):
              assert 'id="'+node+'"' in html,node
          assert "api('/api/corrected-trace-build'" in js
          assert "if p=='/api/corrected-trace-build':" in backend
          snippet=js[js.index("$('buildCorrected').onclick"):js.index("$('exportCorrected').onclick")]
          for old in ('/api/trace-build','/api/enhanced-trace-build','/api/auto-analyze','/api/segment-build'):
              assert old not in snippet,old
          print('PASS: dedicated new incremental UI and routes')
          PY
