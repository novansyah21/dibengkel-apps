name: AutoWiring v0.3.21 terminal OCR + global loading
on:
  push:
    branches: [feature/v0.3.21]
  pull_request:
    branches: [feature/v0.3.20]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused image dependency (no historic pipeline execution)
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile Python and validate JavaScript
        run: |
          python -m compileall -q viewer.py autowiring tests
          node --check web/app.js
          node --check web/loading.js
      - name: Existing tracing & cache regressions
        run: python -m unittest discover -s tests -p "test_*trac*.py" -v
      - name: New four-circle-only OCR and visual-conflict regression
        run: python -m unittest discover -s tests -p "test_terminal_accuracy.py" -v
      - name: Global visible progress / network / image-hold tests
        run: node --test tests/test_loading_progress.cjs
      - name: Verify UI, new routes, coexistence with saved older tables
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          from viewer import setup
          with sqlite3.connect(':memory:') as db:
              setup(db)
              tables={x[0] for x in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'terminal_accuracy_runs_v0321','terminal_accuracy_items_v0321','terminal_accuracy_reviews_v0321','branch_runs_v0320','corrected_runs_v0319'} <= tables
          html=Path('web/index.html').read_text()
          js=Path('web/app.js').read_text()
          backend=Path('viewer.py').read_text()
          for element in ('diagramLoading','loadingTitle','loadingDetail','loadingElapsed','activityResult','buildTerminalAccuracy','terminalAccuracyList','exportTerminalAccuracy'):
              assert 'id="'+element+'"' in html,element
          assert '/loading.js?v=0321' in html
          for api in ('/api/terminal-accuracy','/api/terminal-accuracy-build','/api/terminal-accuracy-review'):
              assert api in backend,api
          target=js[js.index("$('buildTerminalAccuracy').onclick"):js.index("$('exportTerminalAccuracy').onclick")]
          for forbidden in ('/api/auto-analyze','/api/branch-trace-build','/api/corrected-trace-build','/api/independent-ocr-build'):
              assert forbidden not in target,forbidden
          assert 'ActionProgress.hold' in js
          print('PASS: one-click v0321 only, legacy SQLite preserved, visible loading during diagram decode')
          PY
