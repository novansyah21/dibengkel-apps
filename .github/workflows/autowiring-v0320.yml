name: AutoWiring v0.3.20 branch-aware regression
on:
  push:
    branches: [feature/v0.3.20]
  pull_request:
    branches: [feature/v0.3.19]
  workflow_dispatch:

jobs:
  branch-aware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight imaging dependency
        run: python -m pip install "Pillow>=10,<13"
      - name: Compile Python sources
        run: python -m compileall -q viewer.py autowiring tests
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Verify upgraded SQLite schema and new routes
        run: |
          python - <<'PY'
          import sqlite3
          from viewer import setup
          from pathlib import Path
          with sqlite3.connect(':memory:') as db:
              setup(db)
              names={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              assert {'branch_runs_v0320','branch_items_v0320','branch_reviews_v0320','corrected_runs_v0319'}<=names
          source=Path('viewer.py').read_text()
          js=Path('web/app.js').read_text()
          html=Path('web/index.html').read_text()
          for route in ['/api/branch-trace','/api/branch-trace-build','/api/branch-review']:
              assert route in source,route
          for id in ('buildBranchTrace','layerBranchTrace','branchTraceList','exportBranchTrace'):
              assert 'id="'+id+'"' in html,id
          chunk=js[js.index("$('buildBranchTrace').onclick"):js.index("$('exportBranchTrace').onclick")]
          for old in ('/api/auto-analyze','/api/trace-build','/api/corrected-trace-build','/api/enhanced-trace-build'):
              assert old not in chunk,old
          print("PASS: all schema/routes/UI present; no prior builder invoked")
          PY
      - name: Run branch-aware and previous trace regressions
        run: python -m unittest discover -s tests -p "test_*trac*.py" -v
