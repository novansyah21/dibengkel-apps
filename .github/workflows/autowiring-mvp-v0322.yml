name: AutoWiring v0.3.22 assisted-review MVP
on:
  push:
    branches: [feature/v0.3.22-mvp]
  pull_request:
    branches: [feature/v0.3.21]
  workflow_dispatch:

jobs:
  mvp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency only
        run: python -m pip install "Pillow>=10,<13"
      - name: Syntax all Python and JS
        run: |
          python -m compileall -q viewer.py autowiring tests
          node --check web/app.js
          node --check web/loading.js
      - name: Previous trace and OCR regressions
        run: |
          python -m unittest discover -s tests -p "test_*trac*.py" -v
          python -m unittest discover -s tests -p "test_terminal_accuracy.py" -v
      - name: New source-locked MVP review and immutable audit snapshots
        run: python -m unittest discover -s tests -p "test_mvp_review.py" -v
      - name: Existing loading progress regressions
        run: node --test tests/test_loading_progress.cjs
      - name: Verify no previous builders in MVP workflow and compatible schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          from viewer import setup
          with sqlite3.connect(':memory:') as db:
              setup(db)
              tables={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              for needed in ('mvp_snapshots_v0322','terminal_accuracy_runs_v0321','branch_runs_v0320'):
                  assert needed in tables, needed
          js=Path('web/app.js').read_text()
          html=Path('web/index.html').read_text()
          server=Path('viewer.py').read_text()
          for identifier in ('loadMvp','saveMvpSnapshot','exportMvpJson','exportMvpCsv','mvpReviewQueue','diagramLoading'):
              assert 'id="'+identifier+'"' in html,identifier
          for route in ('/api/mvp-report','/api/mvp-snapshot','/api/mvp-snapshots'):
              assert route in server,route
          click=js[js.index("$('loadMvp').onclick"):js.index("function exportMvpFile")]
          assert '/api/mvp-report' in click
          for old in ('/api/auto-analyze','/api/graph-build','/api/branch-trace-build','/api/terminal-accuracy-build'):
              assert old not in click,old
          assert "electrically_verified_connections" in Path('autowiring/mvp_review.py').read_text()
          print('PASS: source-locked MVP, zero previous analysis steps, audit and review routes')
          PY
